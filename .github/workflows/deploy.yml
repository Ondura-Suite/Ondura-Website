name: Deploy website

# The site is rebuilt whenever this repo changes and regularly in between,
# so new screenshots, icons and releases in Ondura-Core show up on
# ondura.mirranet.de without anyone touching this repo.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [ondura-core-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out Ondura-Core
        uses: actions/checkout@v5
        with:
          repository: Ondura-Suite/Ondura-Core
          path: .core
          sparse-checkout: |
            docs/screenshots
            apps/ondura/public

      - name: Sync screenshots, icons and release info
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/sync-core.sh
          scripts/sync-core.sh .core site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
