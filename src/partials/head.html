  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f54d4">
  <link rel="alternate" hreflang="en" href="{{url:en}}">
  <link rel="alternate" hreflang="de" href="{{url:de}}">
  <link rel="alternate" hreflang="x-default" href="{{url:en}}">
  <script>
    // Pick the language before anything renders. An explicit choice from the
    // switcher wins; otherwise German browsers get German, everyone else English.
    (function () {
      var page = "{{lang}}", stored = null;
      try { stored = localStorage.getItem("ondura-lang"); } catch (e) {}
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
      var browser = String(langs[0] || "").toLowerCase().indexOf("de") === 0 ? "de" : "en";
      var wanted = stored === "de" || stored === "en" ? stored : browser;
      // German pages only redirect on an explicit choice, so shared /de/ links stay German.
      if (wanted !== page && (page === "en" || stored === "en")) {
        location.replace("{{alt_href}}" + location.hash);
      }
    })();
  </script>

  <link rel="preload" href="{{base}}assets/fonts/instrument-sans-wdth.woff2" as="font" type="font/woff2" crossorigin>

  <script src="{{base}}assets/js/site.js" defer></script>
